[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pubify-data"
version = "0.1.0"
description = "TeX-agnostic publication data, artifact, and CLI runtime"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
  "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "build>=1.2",
  "mkdocs>=1.6",
  "mkdocstrings[python]>=0.30",
  "twine>=5.0",
]

[project.urls]
Documentation = "https://github.com/nvnunes/pubify-data"
Repository = "https://github.com/nvnunes/pubify-data"
Changelog = "https://github.com/nvnunes/pubify-data/blob/main/CHANGELOG.md"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
